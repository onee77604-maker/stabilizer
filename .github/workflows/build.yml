name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle 8.7 (FIX Gradle 9.8.0)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Benerin JVM Target 17
        run: |
          find . -type f \( -name "*.kts" -o -name "*.gradle" \) -exec sed -i 's/JVM_1_8/JVM_17/g; s/VERSION_1_8/VERSION_17/g; s/"1.8"/"17"/g' {} \; || true

      - name: Build APK
        run: |
          # Bikin wrapper kalau gak ada
          if [ ! -f "./gradlew" ]; then
            echo "gradlew gak ada, bikin wrapper 8.7"
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-hasil
          path: app/build/outputs/apk/debug/*.apk
