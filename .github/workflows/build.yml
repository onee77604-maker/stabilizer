name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: FIX JVM 1.8 vs 17 Brutal
        run: |
          echo "kotlin.jvm.target.validation.mode=IGNORE" >> gradle.properties
          cat gradle.properties
          python3 << 'PY'
          import pathlib, re, glob
          for f in glob.glob("**/build.gradle.kts", recursive=True) + glob.glob("**/build.gradle", recursive=True):
              p = pathlib.Path(f)
              t = p.read_text()
              orig = t
              t = t.replace("VERSION_1_8", "VERSION_17")
              t = t.replace("JVM_1_8", "JVM_17")
              t = re.sub(r'jvmTarget\s*=\s*["\']1\.8["\']', 'jvmTarget = "17"', t)
              t = re.sub(r'"1\.8"', '"17"', t)
              if t != orig:
                  print(f"Fixed {f}")
                  p.write_text(t)
          PY
          echo "=== CEK ==="
          cat app/build.gradle.kts | grep -E "VERSION|jvmTarget" | head -n 20 || true

      - name: Build APK
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-hasil
          path: app/build/outputs/apk/debug/*.apk
