name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK (FIX bug sdkmanager 16.0)
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Benerin JVM Target jadi 17
        run: |
          echo "Nambal build.gradle.kts..."
          find . -name "build.gradle.kts" -exec sed -i 's/JvmTarget.JVM_1_8/JvmTarget.JVM_17/g' {} \;
          find . -name "build.gradle.kts" -exec sed -i 's/jvmTarget.*=.*".*1.8.*"/jvmTarget = "17"/g' {} \;
          find . -name "build.gradle.kts" -exec sed -i 's/sourceCompatibility.*VERSION_1_8/sourceCompatibility = JavaVersion.VERSION_17/g' {} \;
          find . -name "build.gradle.kts" -exec sed -i 's/targetCompatibility.*VERSION_1_8/targetCompatibility = JavaVersion.VERSION_17/g' {} \;
          find . -name "build.gradle" -exec sed -i 's/JvmTarget.JVM_1_8/JvmTarget.JVM_17/g' {} \;
          echo "--- app/build.gradle.kts setelah ditambal ---"
          cat app/build.gradle.kts | head -n 120 || cat app/build.gradle | head -n 120

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant permission & Build APK
        run: |
          chmod +x gradlew || true
          ./gradlew assembleDebug --stacktrace || gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-hasil
          path: app/build/outputs/apk/debug/*.apk
