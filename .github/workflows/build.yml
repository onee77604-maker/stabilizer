name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Benerin JVM Target 17 total
        run: |
          find . -type f -name "*.kts" -exec sed -i 's/JVM_1_8/JVM_17/g; s/"1.8"/"17"/g; s/VERSION_1_8/VERSION_17/g' {} \; || true
          find . -type f -name "*.gradle" -exec sed -i 's/JVM_1_8/JVM_17/g; s/VERSION_1_8/VERSION_17/g' {} \; || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        run: |
          echo "Cek gradlew ada gak?"
          ls -lh | grep gradle || true
          # Kalau ada gradlew pakai itu, kalau gak ada pakai gradle langsung
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "gradlew gak ada, pakai gradle global"
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-hasil
          path: app/build/outputs/apk/debug/*.apk
